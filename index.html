<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buon Privy</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@380;500;650;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#070711; --card:#12121c; --line:rgba(203,208,235,.12); --text:#eaedff; --muted:#9aa3c7; --accent:#6b63f6; }
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Outfit, ui-sans-serif, system-ui, sans-serif; }
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; }
    .brand { font-weight: 800; }
    .badge { margin-left: 8px; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent); }
    .shell { max-width: 920px; margin: 0 auto; padding: 0 18px 40px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
    .kicker { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--muted); margin: 0; }
    h1 { margin: 8px 0; }
    .cash-amt { font-size: 26px; font-weight: 800; }
    .copy { word-break: break-all; font-family: ui-monospace, monospace; font-size: 13px; }
    .fine, .meta, .sub, .muted { color: var(--muted); font-size: 13px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
    button { cursor: pointer; border: 0; }
    .primary, .ghost { border-radius: 999px; padding: 10px 14px; font-weight: 650; }
    .primary { background: var(--accent); color: #fff; }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .slim { padding: 8px 12px; font-size: 12px; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 12px; margin-right: 8px; }
    .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #1b1b2b; border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="shell"><div id="root">Loading Privy SDK…</div></div>
  <script>
    function fail(msg) {
      var el = document.getElementById("root");
      if (el) el.innerHTML = "<section class='card'><p class='kicker'>boot</p><h1>Privy SDK failed to load</h1><p class='copy'>" + String(msg) + "</p></section>";
    }
    window.addEventListener("error", function (e) { fail(e.message || e.error || e); });
    window.addEventListener("unhandledrejection", function (e) { fail(e.reason && e.reason.message ? e.reason.message : e.reason); });
    setTimeout(function () {
      if (document.getElementById("root").textContent.indexOf("Loading Privy") >= 0) fail("Timed out. Hard refresh this tab.");
    }, 20000);
  </script>
  <script type="module" src="./privy-app.js?v=25"></script>
</body>
</html>
